<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav class="navbar">
        <h2>Student Portal</h2>
        <div class="nav-links">
            <span id="userNameDisplay">Student</span>
            <a href="result.html">My Results</a>
            <a onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h1>Available Exams</h1>
        <div id="msg"></div>

        <div id="examList"
            style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; margin-top: 2rem;">
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:5000/api";

        // ✅ Get token from localStorage
        function getHeaders() {
            const token = localStorage.getItem("token");

            return {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            };
        }

        // ✅ Fetch exams
        async function fetchAvailableExams() {
            try {
                const res = await fetch(API_BASE + '/student/exams/available', {
                    headers: getHeaders()
                });

                console.log("Status:", res.status);

                if (!res.ok) {
                    const err = await res.json();
                    console.error("Error:", err);
                    document.getElementById('examList').innerHTML =
                        `<p style="color:red;">${err.message || err.error}</p>`;
                    return;
                }

                const exams = await res.json();
                console.log("Exams:", exams);

                const container = document.getElementById('examList');
                container.innerHTML = '';

                if (exams.length === 0) {
                    container.innerHTML = '<p>No exams available.</p>';
                    return;
                }

                exams.forEach(ex => {
                    const card = document.createElement('div');
                    card.className = 'glass-panel';

                    card.innerHTML = `
                <h3 style="color:#60a5fa;">${ex.subject}</h3>
                <p>
                    Duration: ${ex.duration_minutes} mins<br>
                    Total Marks: ${ex.total_marks}<br>
                    Negative: ${ex.negative_marking}
                </p>
                <button onclick="startExam(${ex.exam_id})" class="btn btn-primary">
                    Start Exam
                </button>
            `;

                    container.appendChild(card);
                });

            } catch (err) {
                console.error("Fetch failed:", err);
            }
        }

        // ✅ Start exam
        async function startExam(exam_id) {
            try {
                const res = await fetch(API_BASE + `/student/exams/${exam_id}/start`, {
                    method: 'POST',
                    headers: getHeaders()
                });

                if (res.ok) {
                    const data = await res.json();

                    localStorage.setItem('active_attempt_id', data.attempt_id);
                    localStorage.setItem('active_exam_id', exam_id);

                    window.location.href = 'exam.html';
                } else {
                    const err = await res.json();
                    alert(err.error);
                }

            } catch (err) {
                console.error(err);
            }
        }

        // ✅ Logout
        function logout() {
            localStorage.removeItem("token");
            window.location.href = "index.html";
        }

        // Run
        fetchAvailableExams();
    </script>

</body>

</html>
